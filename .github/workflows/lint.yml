name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Ruff
        run: pip install ruff

      - name: Ruff 检查
        run: ruff check .

      - name: Ruff 格式化检查
        run: ruff format --check .
